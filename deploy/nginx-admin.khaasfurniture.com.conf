# Nginx site for the Shop Portal.
# Copy to /etc/nginx/conf.d/admin.khaasfurniture.com.conf   (see docs/DEPLOY.md, step 9)
# Needs: /etc/nginx/shop-portal-proxy.conf (deploy/nginx-proxy.conf) and a Let's Encrypt certificate for the name below.

# Throttles (these two lines must sit at the top level of a conf.d file).
limit_req_zone $binary_remote_addr zone=shop_login:10m rate=10r/m;   # password attempts
limit_req_zone $binary_remote_addr zone=shop_general:10m rate=20r/s; # everything else

# Port 80: only for the certificate renewal check, otherwise send everyone to https.
server {
    listen 80;
    listen [::]:80;
    server_name admin.khaasfurniture.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.khaasfurniture.com;

    ssl_certificate     /etc/letsencrypt/live/admin.khaasfurniture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.khaasfurniture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;          # don't advertise the Nginx version
    client_max_body_size 12m;   # photo uploads are limited to 10 MB by the app

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # keep the admin site out of Google

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Password check: at most about 10 tries a minute per visitor (the app also locks after 5 wrong tries).
    location = /api/auth/callback/credentials {
        limit_req zone=shop_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/shop-portal-proxy.conf;
        proxy_pass http://127.0.0.1:3100;
    }

    location / {
        limit_req zone=shop_general burst=60 nodelay;
        include /etc/nginx/shop-portal-proxy.conf;
        proxy_pass http://127.0.0.1:3100;
    }
}
