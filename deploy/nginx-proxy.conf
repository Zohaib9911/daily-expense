# Copy to /etc/nginx/shop-portal-proxy.conf (included by the site file).
# X-Forwarded-For is OVERWRITTEN with the real visitor address (never appended to what the browser sent), because the app
# trusts the last entry for its login throttle and audit log. With Cloudflare in front, run deploy/cloudflare-real-ip.sh once
# so $remote_addr is the visitor and not a Cloudflare server.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_read_timeout 120s;   # report exports and the backup download can take a while
proxy_send_timeout 120s;
